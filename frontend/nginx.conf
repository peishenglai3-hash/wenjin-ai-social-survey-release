limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Fieldwork tools intentionally request camera/microphone from this
    # origin; keep both capabilities same-origin only.
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;

    limit_conn connperip 20;

    location / {
        try_files $uri $uri/ /index.html;
        limit_req zone=static burst=20 nodelay;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn connperip 10;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 510m;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        proxy_pass http://backend:8000;
    }


    location ~ /\. {
        deny all;
        return 404;
    }
}
